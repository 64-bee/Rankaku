sonar.projectKey=rankaku
sonar.projectName=Rankaku
sonar.sourceEncoding=UTF-8

# Sources et tests (back Java et front Angular)
sonar.sources=apps/api/src/main,apps/web/src
sonar.tests=apps/api/src/test,apps/web/src
sonar.test.inclusions=apps/api/src/test/**,apps/web/src/**/*.spec.ts
sonar.exclusions=apps/web/src/**/*.spec.ts,**/node_modules/**,**/dist/**,**/target/**

# Java : binaires compilés et couverture JaCoCo
sonar.java.binaries=apps/api/target/classes
sonar.coverage.jacoco.xmlReportPaths=apps/api/target/site/jacoco/jacoco.xml

# TypeScript : couverture Vitest (format lcov)
sonar.javascript.lcov.reportPaths=apps/web/coverage/web/lcov.info
